[project]
name = "file-backuper"
version = "1.5.1"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
]

[project.scripts]
backuper = "backuper_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backuper_app"]
